<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>LLM Wiki Workflow Graph 圖片檢視與匯出</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .action-bar {
      position: sticky;
      top: 20px;
      z-index: 100;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 14px 28px;
      border-radius: 9999px;
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #38bdf8;
      color: #0f172a;
      transform: translateY(-2px);
    }
    .btn.secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn.secondary:hover {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }
    .image-wrapper {
      max-width: 1200px;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    img, svg {
      width: 100%;
      height: auto;
      display: block;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="action-bar">
    <button class="btn" onclick="downloadPNG()">
      <span>💾 下載 PNG 高解析圖片</span>
    </button>
    <button class="btn secondary" onclick="copyPNG()">
      <span>📋 複製圖片到剪貼簿</span>
    </button>
    <a href="workflow_graph.svg" download="workflow_graph.svg" class="btn secondary" style="text-decoration:none;">
      <span>📥 下載向量 SVG 圖片</span>
    </a>
  </div>

  <div class="image-wrapper" id="imgContainer">
    <img id="svgImg" src="workflow_graph.svg" alt="Workflow Graph">
  </div>

  <canvas id="exportCanvas"></canvas>

  <script>
    function renderToCanvas(callback) {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() {
        const canvas = document.getElementById('exportCanvas');
        canvas.width = img.naturalWidth * 2; // 2x Retina resolution
        canvas.height = img.naturalHeight * 2;
        const ctx = canvas.getContext('2d');
        ctx.scale(2, 2);
        ctx.drawImage(img, 0, 0);
        callback(canvas);
      };
      img.src = 'workflow_graph.svg';
    }

    function downloadPNG() {
      renderToCanvas(function(canvas) {
        const a = document.createElement('a');
        a.download = 'workflow_graph.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      });
    }

    function copyPNG() {
      renderToCanvas(function(canvas) {
        canvas.toBlob(function(blob) {
          if (navigator.clipboard && navigator.clipboard.write) {
            navigator.clipboard.write([
              new ClipboardItem({ 'image/png': blob })
            ]).then(() => {
              alert('✅ 圖片已成功複製到剪貼簿！您可以直接貼上（Cmd+V）到作業或文件中！');
            }).catch(err => {
              alert('瀏覽器權限限制，已為您自動改為下載 PNG 檔案！');
              downloadPNG();
            });
          } else {
            downloadPNG();
          }
        });
      });
    }
  </script>
</body>
</html>
