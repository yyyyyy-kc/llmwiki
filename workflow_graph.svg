<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1350" width="1200" height="1350">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="loop1Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.08)"/>
      <stop offset="100%" stop-color="rgba(30, 41, 59, 0.6)"/>
    </linearGradient>
    <linearGradient id="loop2Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(192, 132, 252, 0.08)"/>
      <stop offset="100%" stop-color="rgba(30, 41, 59, 0.6)"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    
    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 28px; fill: #ffffff; letter-spacing: 0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; fill: #94a3b8; }
    .subgraph-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #f8fafc; text-anchor: middle; }
    .node-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #94a3b8; text-anchor: middle; }
    .gate-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #fbbf24; text-anchor: middle; }
    .edge-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="1200" height="1350" fill="url(#bgGrad)" rx="24"/>
  <rect x="1" y="1" width="1198" height="1348" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" rx="24"/>

  <!-- Top Header Title -->
  <text x="600" y="55" class="title" text-anchor="middle">LLM Wiki 雙層圖狀狀態機架構 (Dual-Loop Graph)</text>
  <text x="600" y="85" class="subtitle" text-anchor="middle">知識庫持續累積自癒迴圈 (Ingestion Loop) ＋ 教學簡報生成與品質檢查迴圈 (Synthesis Loop)</text>

  <!-- ================= LOOP 1 CONTAINER ================= -->
  <rect x="60" y="115" width="1080" height="570" rx="16" fill="url(#loop1Grad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="80" y="135" width="430" height="32" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)"/>
  <text x="95" y="157" class="subgraph-title" fill="#38bdf8">迴圈一：知識攝取與自癒迴圈 (Knowledge Ingestion &amp; Lint Loop)</text>

  <!-- Loop 1 Nodes -->
  <!-- S1: Raw Sources -->
  <g transform="translate(130, 200)">
    <rect width="240" height="60" rx="10" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="120" y="28" class="node-title">📄 原始來源材料 (Raw Sources)</text>
    <text x="120" y="48" class="node-sub">sources/week1~week4 講義 PDF</text>
  </g>

  <!-- Arrow S1 -> S2 -->
  <path d="M 250 260 L 250 310" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- S2: Text & Formula Extract -->
  <g transform="translate(130, 310)">
    <rect width="240" height="60" rx="10" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="120" y="28" class="node-title">🔍 文本提取與公式識別</text>
    <text x="120" y="48" class="node-sub">提取定理、布林代數、真值表</text>
  </g>

  <!-- Arrow S2 -> G1 -->
  <path d="M 250 370 L 250 420" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- G1: Gate 1 -->
  <g transform="translate(250, 480)">
    <polygon points="0,-45 120,0 0,45 -120,0" fill="url(#gateGrad)" stroke="#fbbf24" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="0" y="-5" class="gate-text">Gate 1: 符號保真度檢查</text>
    <text x="0" y="15" class="node-sub" fill="#e2e8f0">補數撇號 X'、乘積、運算子</text>
  </g>

  <!-- G1 Retry Loop to S2 -->
  <path d="M 130 480 L 80 480 L 80 340 L 130 340" stroke="#f87171" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowRed)"/>
  <rect x="82" y="400" width="65" height="20" rx="4" fill="#1e293b" stroke="#f87171"/>
  <text x="86" y="414" class="edge-label" fill="#f87171">失真重試</text>

  <!-- Arrow G1 -> S3 (Passed) -->
  <path d="M 370 480 L 520 480" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <rect x="410" y="460" width="55" height="20" rx="4" fill="#1e293b" stroke="#34d399"/>
  <text x="418" y="474" class="edge-label" fill="#34d399">驗證通過</text>

  <!-- S3: Prior Discussion -->
  <g transform="translate(520, 450)">
    <rect width="240" height="60" rx="10" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="120" y="28" class="node-title">💬 先討論：提煉核心觀點</text>
    <text x="120" y="48" class="node-sub">人機協同確立章節概念切分點</text>
  </g>

  <!-- Arrow S3 -> S4 -->
  <path d="M 640 450 L 640 370" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- S4: Generate Summaries & Concepts -->
  <g transform="translate(520, 310)">
    <rect width="240" height="60" rx="10" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="120" y="28" class="node-title">📝 寫入 summaries/ 與 concepts/</text>
    <text x="120" y="48" class="node-sub">5 篇導讀總結 + 9 篇原子概念頁</text>
  </g>

  <!-- Arrow S4 -> S5 -->
  <path d="M 760 340 L 830 340" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- S5: Cross-Reference Bidirectional Links -->
  <g transform="translate(830, 310)">
    <rect width="250" height="60" rx="10" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="125" y="28" class="node-title">🔗 雙向連結 [[Link]] 交叉引用</text>
    <text x="125" y="48" class="node-sub">編織 Obsidian 知識圖譜網絡</text>
  </g>

  <!-- Arrow S5 -> G2 -->
  <path d="M 955 370 L 955 435" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- G2: Gate 2 Topology & Lint -->
  <g transform="translate(955, 480)">
    <polygon points="0,-45 120,0 0,45 -120,0" fill="url(#gateGrad)" stroke="#fbbf24" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="0" y="-5" class="gate-text">Gate 2: Wiki 拓撲健康檢查</text>
    <text x="0" y="15" class="node-sub" fill="#e2e8f0">斷鏈檢驗 / 孤島頁面 (Orphans)</text>
  </g>

  <!-- G2 Repair Loop to S5 -->
  <path d="M 1075 480 L 1115 480 L 1115 340 L 1080 340" stroke="#f87171" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowRed)"/>
  <rect x="1080" y="400" width="65" height="20" rx="4" fill="#1e293b" stroke="#f87171"/>
  <text x="1084" y="414" class="edge-label" fill="#f87171">斷鏈修復</text>

  <!-- Arrow G2 -> S6 -->
  <path d="M 955 525 L 955 580" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <rect x="965" y="540" width="55" height="20" rx="4" fill="#1e293b" stroke="#34d399"/>
  <text x="973" y="554" class="edge-label" fill="#34d399">健康無誤</text>

  <!-- S6: Update Index & Append Log -->
  <g transform="translate(830, 580)">
    <rect width="250" height="60" rx="10" fill="url(#nodeGrad)" stroke="#34d399" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="125" y="28" class="node-title" fill="#34d399">📚 更新 index.md &amp; 追加 log.md</text>
    <text x="125" y="48" class="node-sub">完成持久知識庫編譯存檔</text>
  </g>

  <!-- INTER-LOOP CONNECTOR (S6 -> Loop 2 P2) -->
  <path d="M 830 610 L 600 610 L 600 755" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,6" fill="none" marker-end="url(#arrowBlue)"/>
  <rect x="515" y="665" width="170" height="26" rx="6" fill="#1e293b" stroke="#38bdf8"/>
  <text x="600" y="682" class="edge-label" fill="#38bdf8" text-anchor="middle">✨ 提供結構化持久知識</text>

  <!-- ================= LOOP 2 CONTAINER ================= -->
  <rect x="60" y="725" width="1080" height="570" rx="16" fill="url(#loop2Grad)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="80" y="745" width="430" height="32" rx="6" fill="rgba(192, 132, 252, 0.15)" stroke="rgba(192, 132, 252, 0.4)"/>
  <text x="95" y="767" class="subgraph-title" fill="#c084fc">迴圈二：教學簡報生成與驗證迴圈 (Presentation Generation Loop)</text>

  <!-- P1: Pedagogy Target -->
  <g transform="translate(130, 800)">
    <rect width="240" height="60" rx="10" fill="url(#nodeGrad)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="120" y="28" class="node-title">🎯 定義教學目標與認知心智</text>
    <text x="120" y="48" class="node-sub">鎖定零基礎初學者直覺化理解</text>
  </g>

  <!-- Arrow P1 -> P2 -->
  <path d="M 370 830 L 480 830" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>

  <!-- P2: Query Wiki Knowledge -->
  <g transform="translate(480, 800)">
    <rect width="240" height="60" rx="10" fill="url(#nodeGrad)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="120" y="28" class="node-title">🔎 檢索 Wiki 提取結構化知識</text>
    <text x="120" y="48" class="node-sub">調用定理、推導、電路真值表</text>
  </g>

  <!-- Arrow P2 -> G3 -->
  <path d="M 600 860 L 600 915" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>

  <!-- G3: Gate 3 Wiki Citation Coverage -->
  <g transform="translate(600, 960)">
    <polygon points="0,-45 120,0 0,45 -120,0" fill="url(#gateGrad)" stroke="#fbbf24" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="0" y="-5" class="gate-text">Gate 3: 來源引用覆蓋檢查</text>
    <text x="0" y="15" class="node-sub" fill="#e2e8f0">論據是否 100% 綁定 Wiki 頁面</text>
  </g>

  <!-- G3 Fallback Loop to P2 -->
  <path d="M 480 960 L 430 960 L 430 830 L 480 830" stroke="#f87171" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowRed)"/>
  <rect x="395" y="880" width="65" height="20" rx="4" fill="#1e293b" stroke="#f87171"/>
  <text x="400" y="894" class="edge-label" fill="#f87171">補充證據</text>

  <!-- Arrow G3 -> P4 -->
  <path d="M 720 960 L 830 960" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <rect x="745" y="940" width="55" height="20" rx="4" fill="#1e293b" stroke="#34d399"/>
  <text x="753" y="954" class="edge-label" fill="#34d399">依據充分</text>

  <!-- P4: Slide Outline & Storyline -->
  <g transform="translate(830, 930)">
    <rect width="250" height="60" rx="10" fill="url(#nodeGrad)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="125" y="28" class="node-title">📋 規劃大綱與 11 頁故事線</text>
    <text x="125" y="48" class="node-sub">落實 One Idea Per Slide 原則</text>
  </g>

  <!-- Arrow P4 -> G4 -->
  <path d="M 955 990 L 955 1055" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>

  <!-- G4: Gate 4 Cognitive Load & Overflow -->
  <g transform="translate(955, 1100)">
    <polygon points="0,-45 120,0 0,45 -120,0" fill="url(#gateGrad)" stroke="#fbbf24" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="0" y="-5" class="gate-text">Gate 4: 認知負荷與溢出預檢</text>
    <text x="0" y="15" class="node-sub" fill="#e2e8f0">條目 &lt; 3 點、單頁文字密度審核</text>
  </g>

  <!-- G4 Fallback to P4 -->
  <path d="M 1075 1100 L 1115 1100 L 1115 960 L 1080 960" stroke="#f87171" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowRed)"/>
  <rect x="1080" y="1020" width="65" height="20" rx="4" fill="#1e293b" stroke="#f87171"/>
  <text x="1084" y="1034" class="edge-label" fill="#f87171">切分重整</text>

  <!-- Arrow G4 -> P5 -->
  <path d="M 955 1145 L 955 1200" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <rect x="965" y="1160" width="55" height="20" rx="4" fill="#1e293b" stroke="#34d399"/>
  <text x="973" y="1174" class="edge-label" fill="#34d399">節奏極佳</text>

  <!-- P5: Render HTML Presentation -->
  <g transform="translate(830, 1200)">
    <rect width="250" height="60" rx="10" fill="url(#nodeGrad)" stroke="#34d399" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="125" y="28" class="node-title" fill="#34d399">🖥️ 生成互動式 HTML 簡報</text>
    <text x="125" y="48" class="node-sub">雙軌容錯排版 + 實體開關模擬器</text>
  </g>

  <!-- Arrow P5 -> P6 -->
  <path d="M 830 1230 L 600 1230" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- P6: Final Delivery -->
  <g transform="translate(350, 1200)">
    <rect width="250" height="60" rx="10" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
    <text x="125" y="28" class="node-title" fill="#38bdf8">🎉 成果交付與 GitHub Pages 發布</text>
    <text x="125" y="48" class="node-sub">presentation.html ＋ SUBMISSION.md</text>
  </g>

</svg>